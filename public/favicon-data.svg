<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#6366f1" />
            <stop offset="100%" style="stop-color:#8b5cf6" />
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <blur stdDeviation="5" />
        </filter>
    </defs>
    <!-- Background Shape -->
    <rect width="512" height="512" rx="120" fill="url(#brandGradient)" />
    
    <!-- Lightning Bolt Symbol -->
    <path d="M304 48L144 288h96l-32 176 160-240h-96z" 
          fill="white" 
          stroke="white" 
          stroke-width="10" 
          stroke-linejoin="round"
          transform="translate(20, 10) scale(0.9)" />
          
    <!-- Decorative Accents -->
    <circle cx="400" cy="112" r="24" fill="white" fill-opacity="0.3" />
    <circle cx="430" cy="82" r="12" fill="white" fill-opacity="0.2" />
